<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart - Tiers and Layers</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>

  <header class="navbar">
  <div class="logo-container">
    <img src="your-logo.png" alt="Tiers & Layers Logo" class="logo-img">
    <span class="logo-text">Tiers & Layers</span>
  </div>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="courses.html">courses offerd</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
  </nav>
</header>

  <section class="cart-section">
    <div class="cart-container">
      <!-- Cart Item -->
      <div class="cart-item">
        <img src="https://imgcdn.floweraura.com/rich-chocolate-fantasy-cake-casd2043-A_0.jpg" alt="Chocolate Cake">
        <div class="item-details">
          <h3>Chocolate Fantasy</h3>
          <p>Price: ₹499</p>
          <label>Qty:
            <input type="number" min="1" value="1" class="qty-input" />
          </label>
        </div>
        <button class="remove-btn">Remove</button>
      </div>

    
      <div class="cart-item">
        <img src="https://shreemsweetsandbakery.com/wp-content/uploads/2021/04/Creamy-Vanilla-Delight-600x600.jpg" alt="Vanilla Cake">
        <div class="item-details">
          <h3>Vanilla Delight</h3>
          <p>Price: ₹399</p>
          <label>Qty:
            <input type="number" min="1" value="1" class="qty-input" />
          </label>
        </div>
        <button class="remove-btn">Remove</button>
      </div>

    
      <div class="cart-summary">
        <h2>Total: ₹<span id="total">0</span></h2>
        <button class="checkout-btn">Proceed to Checkout</button>
      </div>
    </div>
  </section>

  <script src="cart.js"></script>
</body>
</html>
